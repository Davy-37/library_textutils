[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "textutils"
version = "0.1.0"
description = "A lightweight Python library for common text-processing operations."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "NZIENGUI Davy" }]
# textutils only relies on the standard library: no runtime dependency.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10.0",
    "pytest-cov>=5.0,<8.0",
    "black>=24.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["textutils*"]
exclude = ["*.tests", "*.tests.*"]

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88

[tool.pytest.ini_options]
testpaths = ["textutils"]
addopts = "--doctest-modules --ignore=build"

[tool.coverage.run]
branch = true
source = ["textutils"]
omit = ["*/tests/*"]

[tool.coverage.report]
show_missing = true
