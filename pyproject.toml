[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "textutils-davy"
version = "0.1.0"
description = "A lightweight Python library for common text-processing operations."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "NZIENGUI Davy" }]
keywords = ["text", "string", "casing", "statistics", "utilities"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing",
]
# textutils only relies on the standard library: no runtime dependency.
dependencies = []

[project.urls]
Homepage = "https://github.com/Davy-37/library_textutils"
Issues = "https://github.com/Davy-37/library_textutils/issues"
Changelog = "https://github.com/Davy-37/library_textutils/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10.0",
    "pytest-cov>=5.0,<8.0",
    "black>=24.0",
    "ruff>=0.6",
    "pre-commit>=3.7",
    "build>=1.2",
    "twine>=5.0",
]

[tool.setuptools.packages.find]
include = ["textutils*"]
exclude = ["*.tests", "*.tests.*"]

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88

[tool.pytest.ini_options]
testpaths = ["textutils"]
addopts = "--doctest-modules --ignore=build"

[tool.coverage.run]
branch = true
source = ["textutils"]
omit = ["*/tests/*"]

[tool.coverage.report]
show_missing = true
