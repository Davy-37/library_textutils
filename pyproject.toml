[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "textutils"
version = "0.1.0"
description = "A lightweight Python library for common text-processing operations."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "NZIENGUI Davy" }]

[tool.setuptools]
packages = ["textutils"]

[tool.pytest.ini_options]
testpaths = ["tests"]
