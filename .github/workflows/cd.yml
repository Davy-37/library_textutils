name: Upload Python Package to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build the distributions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check that the tag matches the project version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "Tag: $TAG - project version: $VERSION"
          test "$TAG" = "v$VERSION"

      - name: Install the build tools
        run: python -m pip install build twine

      - name: Build the wheel and the source distribution
        run: python -m build

      - name: Check the distributions
        run: python -m twine check dist/*

      - name: Upload the distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
